name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@a346fd432a54446b00835dd4cccae54e5aac3e28
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: a346fd432a54446b00835dd4cccae54e5aac3e28
      reference: true
