name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@b2135fc1f9db813b29a989529514e770c32df622
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: b2135fc1f9db813b29a989529514e770c32df622
      reference: true
