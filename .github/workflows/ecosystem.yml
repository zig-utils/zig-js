name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@76b5b9a4e67ab69a672dce9cc6eb9f0cbf86a72c
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 76b5b9a4e67ab69a672dce9cc6eb9f0cbf86a72c
      reference: true
