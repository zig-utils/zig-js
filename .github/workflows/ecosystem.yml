name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@68b5d47cde194784485af267c252833649a227e4
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 68b5d47cde194784485af267c252833649a227e4
      reference: true
