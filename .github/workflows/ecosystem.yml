name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@c104b322b7c410d549c768d33f9ed05b9562fc48
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: c104b322b7c410d549c768d33f9ed05b9562fc48
      reference: true
