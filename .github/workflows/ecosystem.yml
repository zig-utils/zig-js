name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@eb25e6af185facebfcc434e5611b2f4f25ed5c3d
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: eb25e6af185facebfcc434e5611b2f4f25ed5c3d
      reference: true
