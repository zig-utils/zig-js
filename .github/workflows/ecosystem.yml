name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@2e65c9dc707b96dbf30df2125c2bee9835f61544
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 2e65c9dc707b96dbf30df2125c2bee9835f61544
      reference: true
