name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@cc38a0c4fd43658849a0c29705cd2068a5afc4e5
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: cc38a0c4fd43658849a0c29705cd2068a5afc4e5
      reference: true
