name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@32c64b1f076c58bf70e394241f89b535c6fa6f4e
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 32c64b1f076c58bf70e394241f89b535c6fa6f4e
      reference: true
