name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@3f205920f2199bf4f5da54b036b03d5814fa22b0
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 3f205920f2199bf4f5da54b036b03d5814fa22b0
      reference: true
