name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@4d7a97c55e5b8d0e84ac68b0951440b6d2e81188
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 4d7a97c55e5b8d0e84ac68b0951440b6d2e81188
      reference: true
