name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@4806b063beffa43d6283a1a9c062a75f10acebd6
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 4806b063beffa43d6283a1a9c062a75f10acebd6
      reference: true
