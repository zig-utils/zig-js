name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@3cfc45587a4ff5e240af5f0fdab4bc687d9d2524
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 3cfc45587a4ff5e240af5f0fdab4bc687d9d2524
      reference: true
