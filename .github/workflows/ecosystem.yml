name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@37795c3bc6d8d690d61904c759dc898aaa3db2ff
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 37795c3bc6d8d690d61904c759dc898aaa3db2ff
      reference: true
