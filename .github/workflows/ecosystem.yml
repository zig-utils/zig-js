name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@9e9bfba5ea11a91fb67c42227d8cd9ef4781210b
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 9e9bfba5ea11a91fb67c42227d8cd9ef4781210b
      reference: true
