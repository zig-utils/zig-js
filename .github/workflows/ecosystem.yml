name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@047b82096bc96eb4608a2a3f9f4a00239520e81c
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 047b82096bc96eb4608a2a3f9f4a00239520e81c
      reference: true
