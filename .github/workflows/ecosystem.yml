name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@d723a0d5d42d316a8ed40ecaad3f415543b38d55
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: d723a0d5d42d316a8ed40ecaad3f415543b38d55
      reference: true
