name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@2e215bc8c13f432205f8f0a5dbbbcd41f883bb62
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 2e215bc8c13f432205f8f0a5dbbbcd41f883bb62
      reference: true
