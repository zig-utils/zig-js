name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@a455438113dff49d53dbec42fa0ea81c5075da24
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: a455438113dff49d53dbec42fa0ea81c5075da24
      reference: true
