name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@4bdfef0747759ca26e07ccada277e57ae3334f3d
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 4bdfef0747759ca26e07ccada277e57ae3334f3d
      reference: true
