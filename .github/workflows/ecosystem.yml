name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@9f6ac1f1109416a183e923f0b58a6c34770ba652
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 9f6ac1f1109416a183e923f0b58a6c34770ba652
      reference: true
