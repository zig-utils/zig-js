name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@6fdda991cf886f8522b13e95a0e45abfabfedb7a
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 6fdda991cf886f8522b13e95a0e45abfabfedb7a
      reference: true
