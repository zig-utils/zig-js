name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@f6ad81c85eb01f99b57e6f7560d398c4984dfaea
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: f6ad81c85eb01f99b57e6f7560d398c4984dfaea
      reference: true
