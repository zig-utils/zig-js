name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@6672fd632c5c691b884836e2e63ac9a574f2f24a
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 6672fd632c5c691b884836e2e63ac9a574f2f24a
      reference: true
