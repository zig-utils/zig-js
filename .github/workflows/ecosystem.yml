name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@0e235b948e1da6d34ce6b6f5134386e0f517e88e
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 0e235b948e1da6d34ce6b6f5134386e0f517e88e
      reference: true
