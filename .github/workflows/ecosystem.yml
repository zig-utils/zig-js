name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@8755eafddd422d6847fa970cc6f3a3829a56c067
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 8755eafddd422d6847fa970cc6f3a3829a56c067
      reference: true
