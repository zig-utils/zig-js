name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@98c448dae811fd3156dfbdaae5123240350ea865
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 98c448dae811fd3156dfbdaae5123240350ea865
      reference: true
