name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@9b2a5571158aac6a49d35b970c4992d4244b98c8
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 9b2a5571158aac6a49d35b970c4992d4244b98c8
      reference: true
