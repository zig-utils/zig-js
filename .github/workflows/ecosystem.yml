name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@e837dd0ba4e334e6dd004310f6d79af7a0846ff7
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: e837dd0ba4e334e6dd004310f6d79af7a0846ff7
      reference: true
