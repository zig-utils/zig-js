name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@3553a8751a8f46f1783e7c067bbcedd5fd3bbacb
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 3553a8751a8f46f1783e7c067bbcedd5fd3bbacb
      reference: true
