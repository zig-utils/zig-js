name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@5f9d5e5905704c1358b525bb4d88f275343e33bd
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 5f9d5e5905704c1358b525bb4d88f275343e33bd
      reference: true
