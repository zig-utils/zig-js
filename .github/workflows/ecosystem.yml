name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@bd990bb2236f72a705dc3188bbf05228e1e49ce3
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: bd990bb2236f72a705dc3188bbf05228e1e49ce3
      reference: true
