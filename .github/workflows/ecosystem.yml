name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@3e360415fed49f594ac9a4951873575bbda9755a
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 3e360415fed49f594ac9a4951873575bbda9755a
      reference: true
