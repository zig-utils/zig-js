name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@1a8b8362b5ebacd8f5c5a2e10f7d312efb348d85
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 1a8b8362b5ebacd8f5c5a2e10f7d312efb348d85
      reference: true
