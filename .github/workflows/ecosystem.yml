name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@e4f53f848d2a82d4ba73111aedacdf007ea45ca4
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: e4f53f848d2a82d4ba73111aedacdf007ea45ca4
      reference: true
