name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@c1e7e7935768e9299f7b08871ed021ec026dd76c
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: c1e7e7935768e9299f7b08871ed021ec026dd76c
      reference: true
