name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@57861fc68f0e5c17ca21b07c87581faa0e546fa4
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 57861fc68f0e5c17ca21b07c87581faa0e546fa4
      reference: true
