name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@2e42e04203b30bd2b7ada872d9f9683d75277af0
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 2e42e04203b30bd2b7ada872d9f9683d75277af0
      reference: true
