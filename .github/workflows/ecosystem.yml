name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@8a8ee70fd572b9dd3b9625bbd6fdd12e940e27cd
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 8a8ee70fd572b9dd3b9625bbd6fdd12e940e27cd
      reference: true
