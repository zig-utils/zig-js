name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@66abf25c58b814a9cc55a3c6a8ae3cd7524d1317
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 66abf25c58b814a9cc55a3c6a8ae3cd7524d1317
      reference: true
