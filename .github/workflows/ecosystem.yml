name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@8716be77155583a0f002bd0ec948b5a038729729
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 8716be77155583a0f002bd0ec948b5a038729729
      reference: true
