name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@016419c81e04c1734293291943ac08504f29cf80
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 016419c81e04c1734293291943ac08504f29cf80
      reference: true
