name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@0a28ece6fc0a86c8b1d721449483fb67391027be
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 0a28ece6fc0a86c8b1d721449483fb67391027be
      reference: true
