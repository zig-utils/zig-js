name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@2468713d58d2bcc4985a06bfa1e7d23a4536f41a
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 2468713d58d2bcc4985a06bfa1e7d23a4536f41a
      reference: true
