name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@23445c2c1fa0c84776a3c14c5703a28f5120f4c4
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 23445c2c1fa0c84776a3c14c5703a28f5120f4c4
      reference: true
