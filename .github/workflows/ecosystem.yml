name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@87632a113a93a4d2b148a51739f01a7fbb850b4d
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 87632a113a93a4d2b148a51739f01a7fbb850b4d
      reference: true
