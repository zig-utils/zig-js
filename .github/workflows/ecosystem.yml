name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@88e4144e22eb4b0936b3e43ae5a7447ad117be19
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 88e4144e22eb4b0936b3e43ae5a7447ad117be19
      reference: true
