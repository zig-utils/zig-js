name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@682ec6e0c08e204fb7af587ebfa6d2123921a7fb
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 682ec6e0c08e204fb7af587ebfa6d2123921a7fb
      reference: true
