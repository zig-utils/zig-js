name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@786c7ed20bf6896e637b2f797fc0af9723ff2ee5
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 786c7ed20bf6896e637b2f797fc0af9723ff2ee5
      reference: true
