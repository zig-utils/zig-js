name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@bffb35f4b42d1a8c00a995da895b6f20527a1f8c
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: bffb35f4b42d1a8c00a995da895b6f20527a1f8c
      reference: true
