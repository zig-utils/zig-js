name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@8ce56bfe0c5da4b7a0a85b4fb1d079d12a350f7e
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 8ce56bfe0c5da4b7a0a85b4fb1d079d12a350f7e
      reference: true
