name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@0bd9515ec25ad715cb0d419a4888e0518e16c5bf
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 0bd9515ec25ad715cb0d419a4888e0518e16c5bf
      reference: true
