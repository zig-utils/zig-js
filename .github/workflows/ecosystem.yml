name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@eb118444a83f76b904c07d123283e23361fc0251
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: eb118444a83f76b904c07d123283e23361fc0251
      reference: true
