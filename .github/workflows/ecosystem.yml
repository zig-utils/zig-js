name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@1230bffb8ff551cc1c6d789660ae5c7868059143
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 1230bffb8ff551cc1c6d789660ae5c7868059143
      reference: true
