name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@9f33f20f6ac8d27fd377791f69f32f1c5679f3ac
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 9f33f20f6ac8d27fd377791f69f32f1c5679f3ac
      reference: true
