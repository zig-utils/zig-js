name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@27bc73aaf504cded240e6c010b2f981aeaacbf38
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 27bc73aaf504cded240e6c010b2f981aeaacbf38
      reference: true
