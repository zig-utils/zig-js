name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@bdfbd367261ffd01a0a130ab6b2f6da14a5dd1f5
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: bdfbd367261ffd01a0a130ab6b2f6da14a5dd1f5
      reference: true
