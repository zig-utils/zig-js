name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@b76aec2b52c3a664b80d920f82ef508e85755f35
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: b76aec2b52c3a664b80d920f82ef508e85755f35
      reference: true
