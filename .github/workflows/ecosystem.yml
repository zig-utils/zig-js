name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@d696b520d48f61342df869b68e1e72dd51be4a9b
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: d696b520d48f61342df869b68e1e72dd51be4a9b
      reference: true
