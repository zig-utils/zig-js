name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@4783f1b16e4c20a74238f608a6aae0a0a7468b9a
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 4783f1b16e4c20a74238f608a6aae0a0a7468b9a
      reference: true
