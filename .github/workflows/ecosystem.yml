name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@2250d983cef3a41b95c41606025a8b55d4af3142
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 2250d983cef3a41b95c41606025a8b55d4af3142
      reference: true
