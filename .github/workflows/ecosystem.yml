name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@4b3852bbb4cea0b0b700b461d3a47c18c47fb844
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 4b3852bbb4cea0b0b700b461d3a47c18c47fb844
      reference: true
