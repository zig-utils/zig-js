name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@46722cbf61bba7597f4f35afba6a4563caf596db
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 46722cbf61bba7597f4f35afba6a4563caf596db
      reference: true
