name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@5617a1094cbc28eafdb1537aa87efe0b4703b8a0
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 5617a1094cbc28eafdb1537aa87efe0b4703b8a0
      reference: true
