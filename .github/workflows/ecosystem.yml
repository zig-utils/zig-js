name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@7c0771545040f4ee55e73d73c7bf9b9015520d6e
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 7c0771545040f4ee55e73d73c7bf9b9015520d6e
      reference: true
