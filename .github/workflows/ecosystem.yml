name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@18655ff6ec393da85b068e33b3e4a5ebc2d965cb
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 18655ff6ec393da85b068e33b3e4a5ebc2d965cb
      reference: true
