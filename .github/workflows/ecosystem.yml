name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@c59c283c4412a0de7d7a1d69e07e258a86afa163
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: c59c283c4412a0de7d7a1d69e07e258a86afa163
      reference: true
