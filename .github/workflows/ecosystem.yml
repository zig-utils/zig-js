name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@46dfbf7ff12fbb13d98e2dc5851a0c2478705ef9
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 46dfbf7ff12fbb13d98e2dc5851a0c2478705ef9
      reference: true
