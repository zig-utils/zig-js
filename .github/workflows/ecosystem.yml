name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@398066f1122f282ded01b7f2e07f82c5e67cdadb
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 398066f1122f282ded01b7f2e07f82c5e67cdadb
      reference: true
