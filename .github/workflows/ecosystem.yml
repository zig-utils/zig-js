name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@8df114deac63de0ab8eb51bd6ea5ed969eca5af6
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 8df114deac63de0ab8eb51bd6ea5ed969eca5af6
      reference: true
