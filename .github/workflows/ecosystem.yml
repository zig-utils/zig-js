name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@f10e99c537a1496b649df6d09617d31e741ab885
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: f10e99c537a1496b649df6d09617d31e741ab885
      reference: true
