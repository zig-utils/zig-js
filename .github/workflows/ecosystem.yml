name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@734e55ba5ef2b07c4cc46c43bdb85f55751a92f4
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 734e55ba5ef2b07c4cc46c43bdb85f55751a92f4
      reference: true
