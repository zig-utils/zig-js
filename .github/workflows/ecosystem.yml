name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@9e97935c78a2051edcd4c675ade35301acf3b54c
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 9e97935c78a2051edcd4c675ade35301acf3b54c
      reference: true
