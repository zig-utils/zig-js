name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@a465738c19efe18266f55bb01eda4efd70e49374
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: a465738c19efe18266f55bb01eda4efd70e49374
      reference: true
