name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@e8872b095d34115ec2a1424b7130d4d5e14e3dac
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: e8872b095d34115ec2a1424b7130d4d5e14e3dac
      reference: true
