name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@1315c7b48ae688c77b75cf4176425cc10bb10962
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 1315c7b48ae688c77b75cf4176425cc10bb10962
      reference: true
