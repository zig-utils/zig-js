name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@190c400dc4774b963d9330642175e3568414616a
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 190c400dc4774b963d9330642175e3568414616a
      reference: true
