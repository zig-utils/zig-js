name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@775c2e8ed88ffb12ed672f56e14488384e5c9087
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 775c2e8ed88ffb12ed672f56e14488384e5c9087
      reference: true
