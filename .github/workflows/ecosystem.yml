name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@da8e5910262623e37ba94f00a18955e7d81b0e55
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: da8e5910262623e37ba94f00a18955e7d81b0e55
      reference: true
