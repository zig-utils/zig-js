name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@bc1fb93ba7377360ef13ba67779af75363f46105
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: bc1fb93ba7377360ef13ba67779af75363f46105
      reference: true
