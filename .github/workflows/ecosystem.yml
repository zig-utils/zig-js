name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@6d3de027651c37c6da3acbc6d627fec1ca6f931b
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 6d3de027651c37c6da3acbc6d627fec1ca6f931b
      reference: true
