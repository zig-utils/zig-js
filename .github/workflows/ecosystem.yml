name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@bc6fd0a054ad3d39ba5e7eb158c0f8ff0041dd31
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: bc6fd0a054ad3d39ba5e7eb158c0f8ff0041dd31
      reference: true
