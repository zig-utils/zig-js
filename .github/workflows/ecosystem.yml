name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@aeea21987512dae3436d2ba29a1ea54e210667dd
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: aeea21987512dae3436d2ba29a1ea54e210667dd
      reference: true
