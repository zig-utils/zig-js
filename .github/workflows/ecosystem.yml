name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@8c7958e9ced312c3ff845474e290e9910f1e7438
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 8c7958e9ced312c3ff845474e290e9910f1e7438
      reference: true
