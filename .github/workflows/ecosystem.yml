name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@624eb431bd5b641474a23e14181892f54d2e9477
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 624eb431bd5b641474a23e14181892f54d2e9477
      reference: true
