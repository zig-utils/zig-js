name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@270cc7d24a9b8c443f23e33f60ad1e5bff84e878
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 270cc7d24a9b8c443f23e33f60ad1e5bff84e878
      reference: true
