name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@82a2fb49ed2f3e14cc3125f155db3ee107e4ae91
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 82a2fb49ed2f3e14cc3125f155db3ee107e4ae91
      reference: true
