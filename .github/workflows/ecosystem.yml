name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@d1281deaa4676396958adac54eb01bfa1b148b21
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: d1281deaa4676396958adac54eb01bfa1b148b21
      reference: true
