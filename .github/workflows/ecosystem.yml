name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@7b4fb84dc0acc28ab739398124c884491403091c
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 7b4fb84dc0acc28ab739398124c884491403091c
      reference: true
