name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@68c97745ac3eb6abae83d9373fc19ac910fcf1f5
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 68c97745ac3eb6abae83d9373fc19ac910fcf1f5
      reference: true
