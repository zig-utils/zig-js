name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@4f7c991266f2eea5685f64959c13e660e6ae4ce4
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 4f7c991266f2eea5685f64959c13e660e6ae4ce4
      reference: true
