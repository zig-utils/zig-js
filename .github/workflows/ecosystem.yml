name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@c52cf3d297aaf52d0d5dac6150cabddf28b496b9
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: c52cf3d297aaf52d0d5dac6150cabddf28b496b9
      reference: true
