name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@4e356cb47db0d514580c227503f2c9029d96fc4b
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 4e356cb47db0d514580c227503f2c9029d96fc4b
      reference: true
