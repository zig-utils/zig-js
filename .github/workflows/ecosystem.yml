name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@c8942b45ec2b8bdaf80420e3307c8b4ca5af22b3
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: c8942b45ec2b8bdaf80420e3307c8b4ca5af22b3
      reference: true
