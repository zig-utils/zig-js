name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@40e0b896c8924f83e73a9f429884946b6fdb94f5
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 40e0b896c8924f83e73a9f429884946b6fdb94f5
      reference: true
