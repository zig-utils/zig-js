name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@3101c74f65877d02947a28dd21cfada59f5fc18d
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 3101c74f65877d02947a28dd21cfada59f5fc18d
      reference: true
