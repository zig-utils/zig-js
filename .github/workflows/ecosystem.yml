name: Ecosystem

# Every branch/tag push gets its own exact-SHA run; never cancel an older push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    if: github.event_name != 'push' || github.event.deleted != true
    uses: zig-utils/zig-js-ecosystem/.github/workflows/ecosystem.yml@3836d578ea2ac9ae8d9d409308aaaadfc9cb492a
    with:
      engine_sha: ${{ github.sha }}
      suite_ref: 3836d578ea2ac9ae8d9d409308aaaadfc9cb492a
      reference: true
